# Fixed project name so local runs and Jenkins runs manage the same stack.
name: calculator-devops

services:
  calculator:
    # Jenkins injects the build-tagged image; locally it builds from the Dockerfile.
    image: ${DOCKER_IMAGE:-mayanktan/calculator-devops:latest}
    build: .
    container_name: calculator
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xms128m -Xmx384m   # read by the JVM automatically
    expose:
      - "8080"                # internal only; nginx reaches it
    networks:
      - calc-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: calc-nginx
    depends_on:
      calculator:
        condition: service_healthy
        restart: true         # restart nginx after calculator is redeployed (new IP, fresh config)
    ports:
      - "80:80"               # public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - calc-net
    restart: unless-stopped

networks:
  calc-net:
    driver: bridge
