# No underscore in the name: it is sent as the Host header otherwise, and Tomcat rejects it
upstream calc-backend {
    server calculator:8080;   # 'calculator' is the service name in compose
}

server {
    listen 80 default_server;
    server_name _;

    # Inherited by every proxied location below
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Pass the API through
    location /api/ {
        proxy_pass http://calc-backend;
    }

    # Health endpoint for external monitoring
    location /actuator/ {
        proxy_pass http://calc-backend;
    }

    # Small landing page
    location / {
        default_type text/html;
        return 200 '<h1>Calculator DevOps</h1><p>Endpoints: /api/v1/add, /subtract, /multiply, /divide, /power (?a=&b=) and /actuator/health</p><p>Try <a href="/api/v1/add?a=2&b=3">/api/v1/add?a=2&b=3</a></p>';
    }
}
